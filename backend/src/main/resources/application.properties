spring.application.name=demo
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.datasource.url=jdbc:postgresql://localhost:5432/mealplanner
# Local-dev-only fallback; matches docker-compose.yaml's default. Spring Boot
# already reads SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD from the
# environment ahead of this file (that's how docker-compose overrides it), and
# DB_USERNAME / DB_PASSWORD work the same way for a host-based `./mvnw spring-boot:run`.
# Real credentials belong in application-local.properties (gitignored), not here.
spring.datasource.username=${DB_USERNAME:petar}
spring.datasource.password=${DB_PASSWORD:localdev}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.upload.dir=./uploads
open-food-facts.base-url=https://world.openfoodfacts.org
# OFF asks for a descriptive User-Agent; helps avoid blocks and empty errors
open-food-facts.user-agent=MealPlanner/1.0 (https://github.com/mealplanner; local-dev)