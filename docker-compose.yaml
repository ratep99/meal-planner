# POSTGRES_USER / POSTGRES_PASSWORD fall back to local-dev-only defaults so
# `docker compose up` works with zero setup. Override both in a root ".env"
# (gitignored, see .env.example) for anything that isn't a throwaway local db.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mealplanner
      POSTGRES_USER: ${POSTGRES_USER:-petar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petar} -d mealplanner"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mealplanner
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-petar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
      - mealplanner_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_API: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  maven_cache:
  mealplanner_uploads:
  frontend_node_modules:
